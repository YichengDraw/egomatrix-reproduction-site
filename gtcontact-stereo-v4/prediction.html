<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOT3D 双目预测逐帧核查</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,"Noto Sans SC",sans-serif}body{max-width:1040px;margin:32px auto;padding:0 16px}h1{font-size:1.6rem;margin:0}p{line-height:1.65}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}select,button,input{font:inherit}button,select{padding:5px 8px}.film{position:relative;width:100%;background:#151515}.film video,.film canvas{display:block;width:100%;height:auto}.film canvas{position:absolute;top:0;left:0;pointer-events:none}.timeline{display:flex;align-items:center;gap:12px;margin:10px 0}.timeline input{flex:1;min-width:40px}.legend{display:flex;flex-wrap:wrap;gap:14px}.dot{font-weight:700}.lh{color:#16b98b}.rh{color:#b088fb}.obj{color:#f4a727}.state{font-family:ui-monospace,monospace}.detail{white-space:pre-wrap;overflow-wrap:anywhere}a{color:inherit}table{border-collapse:collapse;text-align:left}td,th{border-bottom:1px solid #8886;padding:6px 14px 6px 0}
</style><p><a href="rounds/R7/">返回本轮全量结果</a></p><h1>HOT3D 预测逐帧核查</h1>
<p>左右画面来自同一时刻的两台 SLAM 相机，已按各自的原始标定去畸变。叠加的手关节和物体原点均来自预测。选择单目模式时，右侧画面显示左眼预测的重投影。</p>
<div class="controls"><label>父录制 <select id="episode"></select></label><label>预测 <select id="mode"><option value="stereo">逐帧双目</option><option value="temporal">双目加双向光流</option><option value="left">仅左眼</option></select></label><label><input type="checkbox" id="overlay" checked>显示预测</label><label><input type="checkbox" id="raw">显示原始二维检测</label></div>
<div class="film"><video playsinline muted preload="metadata"></video><canvas width="960" height="480" aria-label="双目预测叠加"></canvas></div>
<div class="timeline"><button id="play">播放</button><button id="prev" aria-label="上一帧">−1</button><input id="time" type="range" min="0" max="149" value="0"><button id="next" aria-label="下一帧">+1</button><span id="clock"></span></div>
<div class="legend"><span class="dot lh">● 左手</span><span class="dot rh">● 右手</span><span class="dot obj">◆ 物体模型原点</span></div>
<p class="state" id="state"></p><p id="scores"></p><p><a id="data">原始逐帧观测和检测置信度</a> · <a id="xyz">米制预测轨迹</a> · <a id="mp4">下载双目影像</a> · <a id="env" hidden>背景平面叠加</a> · <a id="background-metrics" hidden>背景重建观测</a></p>
<script>
const $=s=>document.querySelector(s),vid=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d'),pick=$('#episode'),mode=$('#mode'),slider=$('#time');let obs,track,entry,flow=null,fit=null,frame=0,token=0;const bones=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20],[5,9,13,17]];
let release;function files(name){return ['https://cdn.jsdelivr.net/gh/YichengDraw/egomatrix-reproduction-site@'+release+'/v4/'+name,'https://raw.githubusercontent.com/YichengDraw/egomatrix-reproduction-site/'+release+'/v4/'+name]}
async function fetchData(name){if(!name)return [];for(const url of files(name)){try{const r=await fetch(url,{signal:AbortSignal.timeout(18000)});if(!r.ok)continue;return await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json()}catch(e){}}throw Error('读取失败 '+name)}
async function load(){const n=++token;vid.pause();const ep=pick.value;location.hash=ep;const z=parents.find(x=>x.episode===ep);
const [o,tr]=await Promise.all([fetchData(z.reviewMedia),fetchData(z.predictionFile)]);if(n!==token)return;obs=o;track=tr;entry=z.evidence;flow=null;if(z.flowFile){fetchData(z.flowFile).then(v=>{if(n===token){flow=v;draw()}})}
const env=$('#env');env.hidden=!z.sceneImage;if(z.sceneImage)env.href=files(z.sceneImage)[1];
const geom=$('#background-metrics');geom.hidden=!z.sceneFile;if(z.sceneFile)geom.href=files(z.sceneFile)[1];const urls=files(z.stereoMedia);vid.onerror=()=>{if(vid.currentSrc!==urls[1])vid.src=urls[1]};vid.src=urls[0];
$('#data').href=files(z.reviewMedia)[1];$('#xyz').hidden=!tr.length;if(tr.length)$('#xyz').href=files(z.predictionFile)[1];$('#mp4').href=urls[1];slider.max=o.frames.length-1;slider.value=0;frame=0;draw();vid.load()}
function hand(pts,side,offset,raw=false){let color=side==='left'?'#39e8b4':'#be8fff';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=raw?1.2:2.6;for(let g of bones){ctx.beginPath();let valid=false;for(let i of g){let p=pts[i];if(!p){valid=false;continue}if(valid)ctx.lineTo(p[0]+offset,p[1]);else ctx.moveTo(p[0]+offset,p[1]);valid=true}ctx.stroke()}for(let p of pts){if(!p)continue;ctx.beginPath();ctx.arc(offset+p[0],p[1],raw?1.5:2.6,0,Math.PI*2);ctx.fill()}}
function draw(){if(!obs)return;let i=Math.max(0,Math.min(obs.frames.length-1,frame)),m=mode.value;ctx.clearRect(0,0,960,480);let s=track[i],hands=s?.hands[m==='temporal'?'stereo':m]||{},o=s?.objects[m];for(let e=0;e<2;e++){ctx.save();ctx.beginPath();ctx.rect(e*480,0,480,480);ctx.clip();if($('#raw').checked){for(let h of obs.frames[i][e].hands)hand(h.uv,h.side,480*e,true)}if($('#overlay').checked){for(let [side,h] of Object.entries(hands))hand(h.uv[e],side,480*e);if(o&&o.pixels[e]){let [x,y]=o.pixels[e];ctx.strokeStyle='#ffbb37';ctx.lineWidth=3;ctx.strokeRect(x+480*e-5,y-5,10,10)}}ctx.restore()}let names=Object.keys(hands).map(s=>s==='left'?'左':'右').join('、')||'无';$('#state').textContent='手部有效  '+names+'　物体有效  '+(o?'是':'否')+'　CAD 匹配内点（左 / 右） '+obs.frames[i].map(x=>x.object_inliers).join(' / ');if(m==='temporal'&&o&&flow){let k=flow.anchor_frame[i];$('#state').textContent+='　光流内点（左 / 右） '+flow.eye_inliers[i].join(' / ')+'，锚帧 '+(k+1)}if(fit){let loc=(m==='left'?fit.mono_left_median_reprojection_px:fit.stereo_vertical_residual_px)[i];$('#state').textContent+='　'+(m==='left'?'重投影误差':'双眼纵向误差')+'（左手 / 右手，px） '+loc.map(x=>x===null?'—':x.toFixed(1)).join(' / ')}let conf=obs.frames[i].map(eye=>eye.hands.map(h=>(h.side==='left'?'左':'右')+' '+h.confidence.toFixed(2)).join('，')||'无');$('#state').textContent+='　手侧置信度（左眼 / 右眼） '+conf.join(' / ');$('#clock').textContent=(i+1)+' / '+obs.frames.length;let g=entry?.methods?.[m==='temporal'?'temporal_stereo':m==='left'?'mono_left':m];$('#scores').textContent=g?'该源登记区间内有效手部帧 '+g.hand.valid+'，有效物体帧 '+g.object.valid+'，所需手和物体同时有效 '+g.simultaneous_frames+' 帧。':'该录制预登记为观察场景。'}
function seek(i){if(!obs)return;vid.pause();frame=Math.max(0,Math.min(obs.frames.length-1,i));slider.value=frame;vid.currentTime=(frame+.02)/obs.fps;draw()}
function anim(){if(obs&&!vid.paused){frame=Math.min(obs.frames.length-1,Math.floor(vid.currentTime*obs.fps));slider.value=frame;draw()}requestAnimationFrame(anim)}$('#play').onclick=()=>vid.paused?vid.play():vid.pause();vid.onplay=()=>$('#play').textContent='暂停';vid.onpause=()=>$('#play').textContent='播放';slider.oninput=()=>seek(+slider.value);$('#prev').onclick=()=>seek(frame-1);$('#next').onclick=()=>seek(frame+1);mode.onchange=draw;$('#overlay').onchange=draw;$('#raw').onchange=draw;pick.onchange=load;
let parents;fetch('rounds/R7/manifest.json.gz').then(r=>new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json()).then(async m=>{release=m.media_commit;const p=m.rows.filter(v=>v.reviewMedia);parents=p;for(let e of p){let opt=new Option(e.episode+' · '+e.evidence.device+(e.evidence.target_name?' · '+e.evidence.target_name:''),e.episode);pick.add(opt)}pick.value=p.some(e=>e.episode===location.hash.slice(1))?location.hash.slice(1):'clip-003285';await load();anim()}).catch(e=>$('#state').textContent='读取录像索引失败 '+e);
</script></html>
