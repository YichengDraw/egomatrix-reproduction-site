<h2 id="case"></h2><p id="status" role="status"></p>
<div id="player" hidden><div class="grid"><figure><canvas id="scene" width="1000" height="650" aria-label="原生物理回放"></canvas><figcaption>原生回放 · 网格为网页显示做了抽稀。青色为机器手，橙色为物体，灰色为场景。拖动旋转，Shift 拖动平移，滚轮缩放。</figcaption></figure><figure id="stereobox"><video id="stereo" muted playsinline controls preload="metadata"></video><figcaption>源录像 · 按官方相机标定去畸变的左右眼</figcaption></figure></div>
